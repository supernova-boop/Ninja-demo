<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f26; --muted:#5b6270; --accent:#2f5bea; --ok:#14804a; --err:#c0392b; --border:#d8dce3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1b1e26; --text:#eceef3; --muted:#9aa1b0; --accent:#6f8dff; --ok:#4ccf8e; --err:#ff7b6b; --border:#323746; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:32px 24px; }
  h1 { margin:0 0 4px; font-size:24px; }
  p.lead { margin:0 0 24px; color:var(--muted); }
  label { display:block; margin:16px 0 4px; font-weight:600; font-size:14px; }
  input, textarea { width:100%; padding:10px 12px; font:inherit; color:inherit; background:transparent; border:1px solid var(--border); border-radius:8px; }
  input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  textarea { min-height:120px; resize:vertical; }
  .error { min-height:18px; margin:4px 0 0; font-size:13px; color:var(--err); }
  button { margin-top:20px; width:100%; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #success { display:none; margin-top:20px; padding:14px 16px; border-radius:8px; border:1px solid var(--ok); color:var(--ok); font-weight:600; }
  #success.show { display:block; }
</style>
</head>
<body>
<main>
  <h1>Get in touch</h1>
  <p class="lead">Send us a message and we'll reply within a day.</p>

  <form id="contactForm" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <p class="error" data-for="name"></p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <p class="error" data-for="email"></p>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>
    <p class="error" data-for="message"></p>

    <button type="submit" id="submitBtn">Send message</button>
  </form>

  <div id="success" role="status" aria-live="polite">Thanks! Your message has been sent.</div>
</main>

<script>
  const form = document.getElementById('contact-form');
  const success = document.getElementById('success');
  const btn = document.getElementById('submitBtn');

  function setError(field, msg) {
    document.querySelector('[data-for="' + field + '"]').textContent = msg;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    success.classList.remove('show');

    const data = Object.fromEntries(new FormData(form));
    let ok = true;
    setError('name', ''); setError('email', ''); setError('message', '');
    if (!data.name.trim()) { setError('name', 'Please enter your name.'); ok = false; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) { setError('email', 'Please enter a valid email address.'); ok = false; }
    if (!data.message.trim()) { setError('message', 'Please enter a message.'); ok = false; }
    if (!ok) return;

    btn.disabled = true;
    btn.textContent = 'Sending…';
    // Simulated network request (no backend in this demo)
    setTimeout(function () {
      form.reset();
      btn.disabled = false;
      btn.textContent = 'Send message';
      success.classList.add('show');
    }, 600);
  });
</script>
</body>
</html>
